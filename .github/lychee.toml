max_concurrency = 4
max_retries = 3
require_https = true
scheme = ["https"]
exclude = [
  # Ask DeepWiki links are excluded from automated checks.
  '^https://deepwiki\.com(?:/|$)',
  # Example domains in the public API documentation are not real services.
  '^https://(?:[^/]+\.)?example\.com(?:/|$)',
]
